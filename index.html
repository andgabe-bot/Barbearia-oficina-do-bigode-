<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbearia Oficina do Bigode - Agendamento</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; padding: 20px; text-align: center; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 8px; max-width: 400px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        input, select, button { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; }
        button { background: #ffc107; color: #000; font-weight: bold; cursor: pointer; }
        .resultado { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>✂️ Oficina do Bigode</h2>
        <p>Seg a Sáb: 09:00 às 19:00<br>(Almoço bloqueado: 12:00 às 13:00)</p>

        <label>Dia da Semana:</label>
        <select id="diaSemana">
            <option value="segunda">Segunda-feira</option>
            <option value="terca">Terça-feira</option>
            <option value="quarta">Quarta-feira</option>
            <option value="quinta">Quinta-feira</option>
            <option value="sexta">Sexta-feira</option>
            <option value="sabado">Sábado</option>
            <option value="domingo">Domingo</option>
        </select>

        <label>Escolha o Horário:</label>
        <input type="time" id="hora" value="12:30">

        <button onclick="verificarHorario()">Verificar Disponibilidade</button>

        <div id="mensagem" class="resultado"></div>
    </div>

    <script>
        async function verificarHorario() {
            const diaSemana = document.getElementById('diaSemana').value;
            const hora = document.getElementById('hora').value;

            const resposta = await fetch('http://localhost:3000/verificar-horario', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ diaSemana, hora })
            });

            const dados = await resposta.json();
            const msgDiv = document.getElementById('mensagem');
            msgDiv.innerText = dados.mensagem;
            msgDiv.style.color = dados.disponivel ? '#4CAF50' : '#f44336';
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbearia Oficina do Bigode</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; padding: 20px; text-align: center; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 8px; max-width: 400px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        input, select, button { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; box-sizing: border-box; }
        button { background: #ffc107; color: #000; font-weight: bold; cursor: pointer; }
        .btn-confirmar { background: #4CAF50; color: #fff; display: none; }
        .resultado { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>✂️ Oficina do Bigode</h2>
        <p>Seg a Sáb: 09:00 às 19:00<br>(Almoço bloqueado: 12:00 às 13:00)</p>
        
        <input type="text" id="nome" placeholder="Nome do Cliente">
        <input type="text" id="telefone" placeholder="Telemóvel / WhatsApp">

        <label>Dia da Semana:</label>
        <select id="diaSemana">
            <option value="segunda">Segunda-feira</option>
            <option value="terca">Terça-feira</option>
            <option value="quarta">Quarta-feira</option>
            <option value="quinta">Quinta-feira</option>
            <option value="sexta">Sexta-feira</option>
            <option value="sabado">Sábado</option>
        </select>

        <label>Escolha o Horário:</label>
        <input type="time" id="hora" value="13:00">

        <button onclick="verificarHorario()">Verificar Disponibilidade</button>
        <button id="btnConfirmar" class="btn-confirmar" onclick="realizarAgendamento()">Confirmar Agendamento</button>

        <div id="mensagem" class="resultado"></div>
    </div>

    <script>
        async function verificarHorario() {
            const diaSemana = document.getElementById('diaSemana').value;
            const hora = document.getElementById('hora').value;

            const resposta = await fetch('/verificar-horario', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ diaSemana, hora })
            });

            const dados = await resposta.json();
            const msgDiv = document.getElementById('mensagem');
            const btnConfirmar = document.getElementById('btnConfirmar');
            
            msgDiv.innerText = dados.mensagem;
            msgDiv.style.color = dados.disponivel ? '#4CAF50' : '#f44336';

            if (dados.disponivel) {
                btnConfirmar.style.display = 'block';
            } else {
                btnConfirmar.style.display = 'none';
            }
        }

        async function realizarAgendamento() {
            const nome = document.getElementById('nome').value;
            const telefone = document.getElementById('telefone').value;
            const diaSemana = document.getElementById('diaSemana').value;
            const hora = document.getElementById('hora').value;

            if (!nome || !telefone) {
                alert('Por favor, preencha o nome e o telemóvel.');
                return;
            }

            const resposta = await fetch('/agendar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nome, telefone, diaSemana, hora })
            });

            const dados = await resposta.json();
            alert(dados.mensagem);
            if (dados.sucesso) {
                location.reload();
            }
        }
    </script>
</body>
</html>
